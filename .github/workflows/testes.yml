name: testes
on: [push, pull_request]
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: prévia do exemplo (voz grátis + quadros)
        run: node cli/index.mjs criar exemplos/primeiro-reels --previa
